<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Elective Bidding - Requirements</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f5f7fa;
            color: #222;
        }

        h1 {
            color: #1f4e79;
        }

        h2 {
            margin-top: 35px;
            color: #333;
        }

        .table-container {
            overflow-x: auto;
            background: white;
            padding: 10px;
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #1f4e79;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border: 1px solid #ddd;
            vertical-align: top;
        }

        tr:nth-child(even) {
            background: #f2f2f2;
        }

        .high {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Academic Elective Bidding & Allocation System</h1>

    <h2>Functional Requirements</h2>

    <div class="table-container">
        <table id="functionalTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Type</th>
                    <th>Description</th>
                    <th>Priority</th>
                    <th>Acceptance Criteria</th>
                    <th>Rationale</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <h2>Non-Functional Requirements</h2>

    <div class="table-container">
        <table id="nonFunctionalTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Type</th>
                    <th>Description</th>
                    <th>Priority</th>
                    <th>Acceptance Criteria</th>
                    <th>Rationale</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        fetch("requirements.json")
            .then(response => response.json())
            .then(data => {

                const functionalTable =
                    document.querySelector("#functionalTable tbody");

                data.functional_requirements.forEach(req => {
                    const row = document.createElement("tr");

                    row.innerHTML = `
                        <td>${req.id}</td>
                        <td>${req.type}</td>
                        <td>${req.description}</td>
                        <td class="high">${req.priority}</td>
                        <td>${req.acceptance_criteria}</td>
                        <td>${req.rationale}</td>
                    `;

                    functionalTable.appendChild(row);
                });

                const nonFunctionalTable =
                    document.querySelector("#nonFunctionalTable tbody");

                data.non_functional_requirements.forEach(req => {
                    const row = document.createElement("tr");

                    row.innerHTML = `
                        <td>${req.id}</td>
                        <td>${req.type}</td>
                        <td>${req.description}</td>
                        <td class="high">${req.priority}</td>
                        <td>${req.acceptance_criteria}</td>
                        <td>${req.rationale}</td>
                    `;

                    nonFunctionalTable.appendChild(row);
                });
            })
            .catch(error => {
                console.error("Error loading requirements:", error);
            });
    </script>

</body>
</html>
